<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="송예찬"><meta name="description" content="층계참 식당 — 손님이 무사히 돌아올 한 끼를 준비하는 3D 웹 시제품"><title>층계참 식당 · 3D 웹 프로토타입</title><!-- STYLE --></head>
<body><div id="app"><header><div class="identity"><span class="eyebrow">오늘 밤, 던전 식당 · 💡 가제</span><h1>층계참 식당<span class="small-badge">WEB 0.4</span></h1></div><div id="status"></div><button id="notebook-button" data-act="open-notebook" hidden>수첩</button><button id="management-button" data-act="management" hidden>가게 개량</button><button class="icon-button" data-act="menu" aria-label="도움말과 저장 설정">☰</button></header><main><section id="world" aria-label="3D 식당. WASD 또는 방향 버튼으로 이동하고, 가까운 대상에서 E로 상호작용하세요."><div id="canvas-wrap"></div><div class="world-caption"><span class="eyebrow">A MEAL FOR THE WAY HOME</span><p>돌아올 몫까지.</p></div><div id="world-tag"></div><div id="hover-label" hidden></div><div id="scene-fallback" hidden>3D 표시를 사용할 수 없습니다. 아래 장소 버튼으로 영업을 계속할 수 있습니다.</div><div id="movement-hud" hidden><div><strong id="player-state">WASD / 방향키 이동</strong><small id="destination-label">E 상호작용</small></div><button id="interact-button" data-act="interact"><kbd>E</kbd> <span id="interact-label">상호작용</span></button><div id="move-pad" aria-label="이동 버튼"><button data-move="KeyW" aria-label="앞으로 이동">↑</button><button data-move="KeyA" aria-label="왼쪽 이동">←</button><button data-move="KeyS" aria-label="뒤로 이동">↓</button><button data-move="KeyD" aria-label="오른쪽 이동">→</button></div></div><div id="steps"></div><nav id="stations" aria-label="식당 장소"><button data-act="station" data-id="door"><b>01</b> 출입문</button><button data-act="station" data-id="guest"><b>02</b> 손님</button><button data-act="station" data-id="kitchen"><b>03</b> 조리대</button><button data-act="station" data-id="stove"><b>04</b> 화덕</button><button data-act="station" data-id="book"><b>05</b> 수첩</button><button data-act="station" data-id="stairs"><b>06</b> 계단</button></nav><div class="camera-help">WASD 이동 · E 상호작용 · 드래그 회전 · 휠 확대 <button data-act="camera">시점 복원</button></div></section><aside id="panel" aria-live="polite"></aside></main><footer><span>💡 수치·외형·엔딩 시험 설정은 기획 검증용입니다. 상세 UI와 최종 미술은 후속 작업입니다.</span><span id="save-state"></span></footer></div><div id="toast" role="status" hidden></div><dialog id="dialog"></dialog><dialog id="cooking-dialog" aria-label="요리 전용 화면"></dialog><!-- SCRIPT --></body></html>
