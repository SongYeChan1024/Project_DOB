name: 기획 발표 사이트

on:
  push:
    branches: [main]
    paths:
      - 'Presentation/**'
      - 'Assets/_DOB/07.UI/Sprites/Loading/T_UI_Loading*.png'
      - 'Docs/기획/플레이/Flowcharts/*.png'
      - '.github/workflows/presentation-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - run: node Presentation/build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Presentation/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
