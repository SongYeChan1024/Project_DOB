<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="다녀왔어: 층계참 식당의 게임 기획 발표와 흐름도 자료실">
  <title>다녀왔어: 층계참 식당 · 게임 기획</title>
  <link rel="stylesheet" href="deck.css">
  <link rel="stylesheet" href="slides.css">
  <link rel="stylesheet" href="trail.css">
  <script src="content.js" defer></script>
  <script src="features.js" defer></script>
  <script src="slides.js" defer></script>
  <script src="trail.js" defer></script>
  <script src="deck.js" defer></script>
</head>
<body>
  <main class="deck" data-cover aria-label="게임 기획 발표">
    <div class="deck-scene">
      <header class="deck-header">
        <span class="deck-brand"><i class="deck-mark" aria-hidden="true"></i>층계참 식당</span>
        <div class="deck-actions">
          <button type="button" class="deck-action" data-present="" aria-haspopup="dialog">
            <i class="deck-icon-book" aria-hidden="true"></i>흐름도 자료실
          </button>
          <button type="button" class="deck-action" id="deck-full" hidden>
            <i class="deck-icon-full" aria-hidden="true"></i><span>전체화면</span>
          </button>
        </div>
      </header>
      <div class="deck-page" data-cover>
        <img class="deck-art" src="assets/loading-title.png" alt="" width="1280" height="714" fetchpriority="high">
        <div class="deck-reading">
          <article class="deck-copy" aria-labelledby="deck-title">
            <p class="deck-kicker" id="deck-number">게임 기획 발표</p>
            <h1 id="deck-title">다녀왔어:<br>층계참 식당</h1>
            <p class="deck-lead" id="deck-lead">손님의 단서를 읽고, 안전한 귀환을 위한 한 끼를 차립니다.</p>
            <p class="deck-detail" id="deck-detail" hidden></p>
            <button type="button" class="deck-related" id="deck-related" data-present="" aria-haspopup="dialog" hidden>
              관련 흐름도 보기 <span aria-hidden="true">↗</span>
            </button>
          </article>
        </div>
      </div>
    </div>
    <footer class="deck-footer">
      <div class="adventure-trail" aria-hidden="true"></div>
      <nav class="deck-nav" aria-label="발표 장 이동">
        <button type="button" id="deck-prev" aria-label="이전 장"><span class="deck-arrow deck-arrow-back" aria-hidden="true"></span>이전</button>
        <label class="deck-jump">
          <span class="deck-position" id="deck-position" aria-hidden="true"></span>
          <select id="deck-picker" aria-label="발표 장 선택"></select>
        </label>
        <button type="button" id="deck-next" aria-label="다음 장">다음<span class="deck-arrow" aria-hidden="true"></span></button>
      </nav>
    </footer>
    <span class="deck-sr" role="status" aria-atomic="true" id="deck-announcement"></span>
    <p class="deck-notice" role="status" id="deck-notice" hidden></p>
  </main>
  <noscript>
    <nav class="deck-fallback" aria-label="흐름도 원본">
      <p>장 이동에는 자바스크립트가 필요합니다. 원본 흐름도를 열어볼 수 있습니다.</p>
      <a href="assets/05-game-overview.png">게임 전체 흐름</a>
      <a href="assets/01-first-service.png">첫 영업</a>
      <a href="assets/02-guest-clues.png">손님의 단서</a>
      <a href="assets/03-expedition-result.png">탐험 판정</a>
      <a href="assets/04-guest-reactions.png">손님의 반응</a>
    </nav>
  </noscript>
</body>
</html>
